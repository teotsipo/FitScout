<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitScout - Affordable Outfit Finder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col items-center p-4 sm:p-8 relative overflow-x-hidden">
  <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[600px] h-[300px] bg-indigo-600/10 blur-[120px] pointer-events-none rounded-full"></div>

  <header class="text-center max-w-2xl mb-8 z-10">
    <h1 class="text-4xl sm:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-500 tracking-tight">FitScout</h1>
    <p class="text-slate-400 mt-3 text-base sm:text-lg">Upload any outfit photo and discover budget-friendly matching alternatives.</p>
  </header>

  <main class="w-full max-w-4xl space-y-6 z-10">
    <div id="dropZone" class="bg-slate-900/80 border-2 border-dashed border-indigo-500/40 rounded-2xl p-6 text-center hover:border-indigo-400 transition-all cursor-pointer shadow-xl backdrop-blur-md relative group">
      <input type="file" id="fileInput" accept="image/*" class="hidden" />
      <div id="uploadPrompt" class="space-y-4 py-6">
        <div class="w-16 h-16 bg-indigo-500/10 rounded-full flex items-center justify-center mx-auto text-indigo-400 group-hover:scale-110 transition-transform"><i class="fa-solid fa-cloud-arrow-up text-2xl"></i></div>
        <div>
          <p class="text-lg font-semibold text-slate-200">Drag & drop your outfit photo here</p>
          <p class="text-sm text-slate-400 mt-1">or click anywhere in this box to browse</p>
        </div>
        <div class="flex flex-wrap items-center justify-center gap-3 pt-2">
          <button type="button" id="selectBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-5 py-2.5 rounded-xl text-sm transition pointer-events-none shadow-lg shadow-indigo-600/20">Select Image</button>
          <button type="button" id="demoBtn" class="bg-slate-800 hover:bg-slate-700 text-indigo-300 font-medium px-5 py-2.5 rounded-xl text-sm border border-slate-700 transition"><i class="fa-solid fa-wand-magic-sparkles mr-1.5"></i> Try Sample Outfit</button>
        </div>
      </div>

      <div id="previewContainer" class="hidden flex flex-col items-center gap-5 w-full max-w-md mx-auto">
        <img id="imagePreview" class="max-h-80 rounded-xl object-contain shadow-md border border-slate-700/80 bg-slate-950/50 p-1" src="" alt="Uploaded Outfit Preview" />
        <div class="w-full text-left space-y-2" id="taggingSection">
          <label for="itemTag" class="text-sm font-semibold text-slate-300 flex items-center gap-2"><i class="fa-solid fa-tag text-indigo-400"></i> Optional item description</label>
          <input type="text" id="itemTag" placeholder="e.g., black bomber jacket (optional for now)" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-slate-200 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition" />
        </div>
        <div class="flex items-center gap-3 w-full justify-center pt-2">
          <button id="resetBtn" type="button" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium px-4 py-3 rounded-xl shadow transition flex items-center gap-2 text-sm border border-slate-700"><i class="fa-solid fa-rotate-left"></i> Change</button>
          <button id="analyzeBtn" type="button" class="flex-1 bg-gradient-to-r from-indigo-500 to-pink-500 hover:opacity-90 text-white font-bold px-8 py-3 rounded-xl shadow-lg transition flex items-center justify-center gap-2 text-sm shadow-indigo-500/20"><i class="fa-solid fa-binoculars"></i> Scout Matches</button>
        </div>
      </div>
    </div>

    <div id="loadingState" class="hidden text-center py-12 space-y-4" aria-live="polite">
      <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-indigo-500 border-t-transparent"></div>
      <p class="text-slate-300 font-medium">Sending your outfit to FitScout...</p>
    </div>

    <div id="errorBanner" class="hidden bg-red-950/60 border border-red-500/50 text-red-200 p-4 rounded-xl text-sm font-medium flex items-start justify-between gap-3 backdrop-blur-sm">
      <div class="flex items-start gap-3"><i class="fa-solid fa-triangle-exclamation text-red-400 text-lg mt-0.5"></i><span id="errorMessage">An error occurred.</span></div>
      <button onclick="hideError()" class="text-red-400 hover:text-red-300 text-sm font-bold px-2 py-0.5">✕</button>
    </div>

    <section id="resultsSection" class="hidden space-y-6" aria-live="polite">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h2 class="text-2xl font-bold text-slate-100">Backend Response</h2>
        <span class="text-xs bg-emerald-500/10 text-emerald-400 font-semibold px-3 py-1 rounded-full border border-emerald-500/30"><i class="fa-solid fa-check-double mr-1"></i> Connected</span>
      </div>
      <div id="resultsGrid"></div>
    </section>
  </main>

  <script>
    const API_URL = 'http://localhost:3000/api/analyze';
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const uploadPrompt = document.getElementById('uploadPrompt');
    const previewContainer = document.getElementById('previewContainer');
    const imagePreview = document.getElementById('imagePreview');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const resetBtn = document.getElementById('resetBtn');
    const demoBtn = document.getElementById('demoBtn');
    const loadingState = document.getElementById('loadingState');
    const resultsSection = document.getElementById('resultsSection');
    const resultsGrid = document.getElementById('resultsGrid');
    const errorBanner = document.getElementById('errorBanner');
    const errorMessage = document.getElementById('errorMessage');
    const itemTagInput = document.getElementById('itemTag');
    let selectedFile = null;

    dropZone.addEventListener('click', (e) => {
      if (e.target.closest('#previewContainer') || e.target.closest('#demoBtn')) return;
      fileInput.click();
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) handleFile(e.target.files[0]);
    });

    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, e => { e.preventDefault(); e.stopPropagation(); }, false);
    });
    ['dragenter', 'dragover'].forEach(eventName => dropZone.addEventListener(eventName, () => dropZone.classList.add('border-indigo-400', 'bg-slate-900')));
    ['dragleave', 'drop'].forEach(eventName => dropZone.addEventListener(eventName, () => dropZone.classList.remove('border-indigo-400', 'bg-slate-900')));
    dropZone.addEventListener('drop', e => { const file = e.dataTransfer?.files[0]; if (file) handleFile(file); });

    demoBtn.addEventListener('click', e => {
      e.stopPropagation();
      hideError();
      selectedFile = null;
      imagePreview.src = 'https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=600&auto=format&fit=crop';
      itemTagInput.value = 'Yellow Statement Blazer';
      uploadPrompt.classList.add('hidden');
      previewContainer.classList.remove('hidden');
      resultsSection.classList.add('hidden');
    });

    function handleFile(file) {
      if (!file.type.startsWith('image/')) {
        showError('Please select a valid image file format (JPEG, PNG, WebP).');
        return;
      }
      hideError();
      selectedFile = file;
      imagePreview.src = URL.createObjectURL(file);
      itemTagInput.value = '';
      uploadPrompt.classList.add('hidden');
      previewContainer.classList.remove('hidden');
      resultsSection.classList.add('hidden');
    }

    resetBtn.addEventListener('click', e => {
      e.stopPropagation();
      fileInput.value = '';
      selectedFile = null;
      imagePreview.src = '';
      itemTagInput.value = '';
      previewContainer.classList.add('hidden');
      uploadPrompt.classList.remove('hidden');
      resultsSection.classList.add('hidden');
      hideError();
    });

    function showError(msg) {
      errorMessage.textContent = msg;
      errorBanner.classList.remove('hidden');
    }
    function hideError() { errorBanner.classList.add('hidden'); }

    analyzeBtn.addEventListener('click', async e => {
      e.stopPropagation();
      if (!selectedFile) {
        showError('Please upload an image first.');
        return;
      }

      hideError();
      previewContainer.classList.add('hidden');
      loadingState.classList.remove('hidden');

      try {
        const base64 = await fileToBase64(selectedFile);
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            filename: selectedFile.name,
            image: base64,
            tag: itemTagInput.value.trim() || null
          })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Backend request failed.');
        displayBackendResponse(data);
      } catch (err) {
        showError(`Could not connect to the FitScout backend: ${err.message}`);
      } finally {
        loadingState.classList.add('hidden');
        previewContainer.classList.remove('hidden');
      }
    });

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function displayBackendResponse(data) {
      resultsGrid.innerHTML = `
        <div class="bg-slate-900 rounded-xl p-5 border border-slate-800 shadow-lg">
          <p class="text-sm text-emerald-400 font-semibold mb-3">The backend received your image.</p>
          <dl class="space-y-2 text-sm">
            <div class="flex justify-between gap-4"><dt class="text-slate-400">Filename</dt><dd class="text-slate-200 truncate">${escapeHtml(data.filename || '—')}</dd></div>
            <div class="flex justify-between gap-4"><dt class="text-slate-400">Description</dt><dd class="text-slate-200">${escapeHtml(data.tag || 'No description provided')}</dd></div>
            <div class="flex justify-between gap-4"><dt class="text-slate-400">Status</dt><dd class="text-slate-200">${escapeHtml(data.message || 'Received')}</dd></div>
          </dl>
        </div>`;
      resultsSection.classList.remove('hidden');
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char]));
    }
  </script>
</body>
</html>

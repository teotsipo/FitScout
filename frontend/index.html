<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitScout - Affordable Outfit Finder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col items-center p-4 sm:p-8">
  <header class="text-center max-w-2xl mb-8"><h1 class="text-4xl sm:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-500">FitScout</h1><p class="text-slate-400 mt-3 text-base sm:text-lg">Upload an outfit and discover affordable matching alternatives.</p></header>
  <main class="w-full max-w-5xl space-y-6">
    <section id="dropZone" class="bg-slate-900 border-2 border-dashed border-indigo-500/40 rounded-2xl p-6 text-center cursor-pointer">
      <input id="fileInput" type="file" accept="image/*" class="hidden">
      <div id="uploadPrompt" class="space-y-4 py-8"><div class="w-16 h-16 rounded-full bg-indigo-500/10 flex items-center justify-center mx-auto text-indigo-400"><i class="fa-solid fa-cloud-arrow-up text-2xl"></i></div><p class="text-lg font-semibold">Upload an outfit photo</p><p class="text-sm text-slate-400">Click here or drag an image into this box.</p><button id="demoBtn" type="button" class="bg-slate-800 hover:bg-slate-700 px-5 py-2.5 rounded-xl text-sm">Try Sample Outfit</button></div>
      <div id="previewContainer" class="hidden flex flex-col items-center gap-4 max-w-md mx-auto"><img id="imagePreview" class="max-h-80 rounded-xl object-contain" alt="Outfit preview"><input id="itemTag" type="text" placeholder="Optional description, e.g. black bomber jacket" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500"><div class="flex gap-3 w-full"><button id="resetBtn" type="button" class="bg-slate-800 px-4 py-3 rounded-xl">Change</button><button id="analyzeBtn" type="button" class="flex-1 bg-gradient-to-r from-indigo-500 to-pink-500 font-bold px-6 py-3 rounded-xl"><i class="fa-solid fa-binoculars mr-2"></i>Scout Matches</button></div></div>
    </section>
    <div id="loadingState" class="hidden text-center py-10"><div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-indigo-500 border-t-transparent"></div><p class="mt-3 text-slate-300">Analyzing outfit and finding alternatives...</p></div>
    <div id="errorBanner" class="hidden bg-red-950 border border-red-500/50 text-red-200 p-4 rounded-xl text-sm"></div>
    <section id="resultsSection" class="hidden space-y-5"><div class="flex items-center justify-between border-b border-slate-800 pb-3"><h2 class="text-2xl font-bold">Outfit Analysis</h2><span class="text-xs bg-emerald-500/10 text-emerald-400 px-3 py-1 rounded-full border border-emerald-500/30">Connected</span></div><div id="resultsGrid" class="space-y-5"></div></section>
  </main>
<script>
const API_BASE='http://localhost:3000';const fileInput=document.getElementById('fileInput'),dropZone=document.getElementById('dropZone'),uploadPrompt=document.getElementById('uploadPrompt'),previewContainer=document.getElementById('previewContainer'),imagePreview=document.getElementById('imagePreview'),itemTag=document.getElementById('itemTag'),analyzeBtn=document.getElementById('analyzeBtn'),resetBtn=document.getElementById('resetBtn'),demoBtn=document.getElementById('demoBtn'),loadingState=document.getElementById('loadingState'),resultsSection=document.getElementById('resultsSection'),resultsGrid=document.getElementById('resultsGrid'),errorBanner=document.getElementById('errorBanner');let selectedFile=null;
dropZone.addEventListener('click',e=>{if(!e.target.closest('button')&&!e.target.closest('input'))fileInput.click()});fileInput.addEventListener('change',e=>{if(e.target.files[0])handleFile(e.target.files[0])});dropZone.addEventListener('dragover',e=>{e.preventDefault();dropZone.classList.add('border-indigo-400')});dropZone.addEventListener('dragleave',()=>dropZone.classList.remove('border-indigo-400'));dropZone.addEventListener('drop',e=>{e.preventDefault();dropZone.classList.remove('border-indigo-400');if(e.dataTransfer.files[0])handleFile(e.dataTransfer.files[0])});
demoBtn.addEventListener('click',e=>{e.stopPropagation();selectedFile=null;imagePreview.src='https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=600&auto=format&fit=crop';itemTag.value='Yellow Statement Blazer';uploadPrompt.classList.add('hidden');previewContainer.classList.remove('hidden');resultsSection.classList.add('hidden');hideError()});
function handleFile(file){if(!file.type.startsWith('image/'))return showError('Please choose an image file.');selectedFile=file;imagePreview.src=URL.createObjectURL(file);itemTag.value='';uploadPrompt.classList.add('hidden');previewContainer.classList.remove('hidden');resultsSection.classList.add('hidden');hideError()}
resetBtn.addEventListener('click',e=>{e.stopPropagation();selectedFile=null;fileInput.value='';imagePreview.src='';itemTag.value='';previewContainer.classList.add('hidden');uploadPrompt.classList.remove('hidden');resultsSection.classList.add('hidden');hideError()});
analyzeBtn.addEventListener('click',async e=>{e.stopPropagation();if(!selectedFile)return showError('Please upload an image first.');loadingState.classList.remove('hidden');previewContainer.classList.add('hidden');resultsSection.classList.add('hidden');hideError();try{const image=await fileToBase64(selectedFile);const response=await fetch(`${API_BASE}/api/analyze`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:selectedFile.name,image,tag:itemTag.value.trim()||null})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Analysis failed.');await displayAnalysis(data.analysis?.items||[])}catch(error){showError(`FitScout error: ${error.message}`)}finally{loadingState.classList.add('hidden');previewContainer.classList.remove('hidden')}});
function fileToBase64(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)})}
async function displayAnalysis(items){if(!items.length){resultsGrid.innerHTML='<div class="bg-slate-900 rounded-xl p-5 text-slate-300">No clothing items were detected.</div>';resultsSection.classList.remove('hidden');return}resultsGrid.innerHTML='';resultsSection.classList.remove('hidden');for(const item of items){const card=document.createElement('article');card.className='bg-slate-900 rounded-2xl p-5 border border-slate-800 shadow-lg';card.innerHTML=`<div class="flex items-center gap-3 mb-4"><div class="w-11 h-11 rounded-xl bg-indigo-500/10 flex items-center justify-center text-indigo-400"><i class="fa-solid ${iconFor(item.category)}"></i></div><div><p class="text-xs uppercase tracking-wider text-indigo-400 font-bold">${escapeHtml(item.category)}</p><h3 class="text-lg font-bold">${escapeHtml(item.description)}</h3></div></div><div class="grid grid-cols-2 gap-3 text-sm mb-5"><div><p class="text-slate-500">Color</p><p>${escapeHtml(item.color||'—')}</p></div><div><p class="text-slate-500">Style</p><p>${escapeHtml(item.style||'—')}</p></div></div><div class="border-t border-slate-800 pt-5"><div class="flex items-center justify-between mb-3"><h4 class="font-bold">Affordable alternatives</h4><span class="text-xs text-slate-500" data-status>Loading...</span></div><div class="grid grid-cols-1 sm:grid-cols-2 gap-3" data-products></div></div>`;resultsGrid.appendChild(card);try{const response=await fetch(`${API_BASE}/api/products`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({category:item.category,description:item.description,color:item.color,style:item.style,maxPrice:50})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Product search failed.');card.querySelector('[data-status]').textContent=data.mode==='demo'?'Demo products':'Live products';card.querySelector('[data-products]').innerHTML=data.products?.length?data.products.map(productCard).join(''):'<p class="text-sm text-slate-500">No products found.</p>'}catch(error){card.querySelector('[data-status]').textContent='Unavailable';card.querySelector('[data-products]').innerHTML=`<p class="text-sm text-red-300">Could not load products: ${escapeHtml(error.message)}</p>`}}}
function productCard(product){const safeUrl=product.url&&/^https?:\/\//i.test(product.url)?product.url:null;const wrapper=safeUrl?`<a href="${escapeHtml(safeUrl)}" target="_blank" rel="noopener noreferrer"`:'<div';const close=safeUrl?'</a>':'</div>';return `${wrapper} class="block bg-slate-950/70 border border-slate-800 rounded-xl overflow-hidden hover:border-indigo-500/50 transition"><img src="${escapeHtml(product.image||'')}" alt="${escapeHtml(product.name)}" class="w-full h-40 object-cover"><div class="p-3"><p class="font-semibold">${escapeHtml(product.name)}</p><div class="flex items-center justify-between mt-2 text-sm"><span class="text-slate-500">${escapeHtml(product.store)}</span><strong class="text-emerald-400">€${Number(product.price).toFixed(2)}</strong></div><div class="mt-2 text-xs text-indigo-400">${Number(product.matchScore)||0}% match</div></div>${close}`}
function iconFor(category){return{outerwear:'fa-shirt',top:'fa-shirt',bottom:'fa-person',shoes:'fa-shoe-prints',accessory:'fa-gem',other:'fa-circle'}[category]||'fa-circle'}function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function showError(message){errorBanner.textContent=message;errorBanner.classList.remove('hidden')}function hideError(){errorBanner.classList.add('hidden')}
</script>
</body>
</html>
